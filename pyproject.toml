[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mundsen-agent"
version = "0.3.0"
description = "Private-by-default building blocks for local personal assistants"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mundsen-agent = "mundsen_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mundsen_agent = [
    "templates/*.tmpl",
    "bundled_skills/*/SKILL.md",
    "bundled_skills/*/agents/*.yaml",
]
