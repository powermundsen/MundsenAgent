name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate source and shell
        run: |
          python -m compileall -q src tests installer/privacy-scan.py
          bash -n installer/install.sh installer/build-release.sh
          git diff --check
      - name: Privacy gate
        run: python installer/privacy-scan.py
      - name: Test
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build release artifacts
        run: |
          package_version="$(python -c 'import sys; sys.path.insert(0, "src"); import mundsen_agent; print(mundsen_agent.__version__)')"
          bash installer/build-release.sh "${package_version}" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: mundsen-agent-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
