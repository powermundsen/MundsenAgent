name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate tag
        run: |
          package_version="$(python -c 'import sys; sys.path.insert(0, "src"); import mundsen_agent; print(mundsen_agent.__version__)')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Require immutable-release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled="$(
            gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/immutable-releases" \
              --jq '.enabled'
          )"
          test "${enabled}" = "true" || {
            echo "Enable repository release immutability before tagging." >&2
            exit 1
          }
      - name: Test and scan
        env:
          PYTHONPATH: src
        run: |
          python installer/privacy-scan.py --history
          python -m unittest discover -s tests -v
      - name: Build
        run: bash installer/build-release.sh "${GITHUB_REF_NAME#v}" dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "${GITHUB_REF_NAME}" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft --verify-tag --generate-notes \
            --title "Mundsen Agent ${GITHUB_REF_NAME#v}" \
            "${prerelease[@]}"
          gh release edit "${GITHUB_REF_NAME}" --draft=false
